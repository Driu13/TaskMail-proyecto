 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMail</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">
    <header class="app-titlebar">
        <div class="titlebar-brand"><span class="titlebar-mark"><img src="Build/taskmailicono.png" alt=""></span><span>TaskMail</span></div>
        <div class="titlebar-controls">
            <button class="titlebar-button" data-window-action="minimize" aria-label="Minimizar">−</button>
            <button class="titlebar-button" data-window-action="maximize" aria-label="Maximizar">□</button>
            <button class="titlebar-button titlebar-close" data-window-action="close" aria-label="Cerrar">×</button>
        </div>
    </header>
    <div class="app-shell">
        <!-- LEFT SIDEBAR -->
        <aside class="main-sidebar">
            <div class="sidebar-brand">
            </div>

            <div class="sidebar-profile">
                <div class="profile-avatar" id="userAvatar">JD</div>
                <div class="profile-info">
                    <span class="profile-name" id="sidebarUserName">Loading...</span>
                    <span class="profile-role" id="sidebarUserRole">User</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </button>
                <button class="nav-item" data-view="tasks">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    Task Manager
                </button>
                <button class="nav-item" data-view="trash">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    Trash
                </button>
                <button class="nav-item" data-view="settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 18.82 1.65 1.65 0 0 0 7.82 15 1.65 1.65 0 0 0 6.33 16.82l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09A1.65 1.65 0 0 0 12 5.18 1.65 1.65 0 0 0 13.18 6 1.65 1.65 0 0 0 14.67 4.48l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1 1.51V11a2 2 0 0 1-2 2 2 2 0 0 1-2 2"></path></svg>
                    Settings
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-quick-action" id="btn-new-event">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Event
                </button>
                <button class="btn-logout" onclick="cerrarSesion()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="16" y2="12"></line></svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="main-content">
            <header class="main-header">
                <button class="btn-sidebar-toggle" id="btn-toggle-sidebar" aria-label="Mostrar/ocultar panel" title="Mostrar/ocultar panel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="header-search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="globalSearch" placeholder="Search events, tasks, or people..." aria-label="Search events, tasks, or people...">
                </div>
                <div class="header-actions">
                    <div class="current-time" id="currentTimeDisplay">00:00:00</div>
                    <div class="notification-bell">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="notification-badge"></span>
                    </div>
                </div>
            </header>

            <main id="view-container">
                <!-- Views are dynamically injected here by app.js -->
            </main>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="window-controls.js"></script>
</body>
</html>
